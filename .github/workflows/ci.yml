# Baseline em todo push e PR. NÃO deploya: o deploy é do webhook no VPS
# (ver docs/DEPLOY.md). Aqui é a rede de segurança que o webhook não tem
# — ele não roda testes, só builda a imagem.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

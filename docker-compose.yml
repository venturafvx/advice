# Docker Compose "simples" (não Swarm) — uso local ou um VPS dedicado só
# a este projeto, sem Traefik. Para o VPS de produção real (Swarm +
# Traefik, domínio advice.autozapx.com), use `docker-stack.yml` — ver
# ARCHITECTURE.md.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - advice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - advice_net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - advice_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - advice_net

volumes:
  advice_postgres_data:
    name: advice_postgres_data

networks:
  advice_net:
    name: advice_net

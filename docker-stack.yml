# Stack para o VPS real (167.88.42.134, "Monadaserver") — Docker Swarm +
# Traefik, mesmo host onde a Evolution API e outros projetos
# (vidanovaguarus, torredeoracao) já rodam. Domínio: advice.autozapx.com.
#
# Rede e estilo dos labels copiados direto de
# /var/www/vidanovaguarus/docker-compose.yml (confirmado rodando de
# verdade nesse VPS). O `vidanovaguarus_web` NÃO tem `tls.certresolver`
# no label — mas isso só funciona pra ele porque o certificado dele já
# foi emitido uma vez e continua servido a partir do acme.json salvo em
# `volume_swarm_certificates`. Pra um domínio NOVO como o nosso, o
# certresolver "letsencryptresolver" (confirmado no comando real do
# traefik_traefik: --certificatesresolvers.letsencryptresolver...) tem
# que estar explícito, senão o Traefik nunca emite o certificado e cai
# no self-signed padrão dele.
#
# O banco NÃO vive mais nesta stack: é o Supabase (projeto `advice`,
# Postgres 17 gerenciado, região ca-central-1), alcançado pela
# `DATABASE_URL` do pooler. Por isso não há serviço `postgres` nem
# volume aqui — backup, upgrade e alta disponibilidade do banco saíram
# da nossa responsabilidade. A rede `advice_internal` fica só para dar
# saída de rede ao `worker`, que não é publicado pelo Traefik.
#
# `docker stack deploy` NÃO builda imagem nem suporta `env_file:` (só
# `docker compose up` suporta isso) — por isso as env vars usam
# `${VAR}`, que o Docker resolve lendo o `.env` no mesmo diretório deste
# arquivo no momento do `docker stack deploy`.
#
# Deploy:
#   cd /var/www/advice
#   docker build -f apps/web/Dockerfile    -t advice-web:latest    .
#   docker build -f apps/worker/Dockerfile -t advice-worker:latest .
#   docker stack deploy -c docker-stack.yml advice
#
# Redeploy depois de um `git pull` + rebuild de imagem (a tag ":latest"
# não muda, então precisa forçar o Swarm a recriar o container):
#   docker service update --force advice_web
#   docker service update --force advice_worker

version: "3.8"

services:
  worker:
    image: advice-worker:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      WHATSAPP_DESTINO: ${WHATSAPP_DESTINO}
      # Sem isto o worker recusa iniciar contra o Supabase (host
      # remoto) e entra em crash loop com o restart_policy abaixo.
      # Guarda em apps/worker/src/index.ts, flag em .env.production.
      WORKER_PRIMARY: ${WORKER_PRIMARY}
      TZ: America/Sao_Paulo
    networks:
      - advice_internal
    deploy:
      replicas: 1
      # NUNCA mais que 1 réplica — o worker aplica migrations no boot e
      # roda o scheduler; múltiplas réplicas disparariam o mesmo
      # lembrete várias vezes.
      restart_policy:
        condition: on-failure

  web:
    image: advice-web:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      WHATSAPP_DESTINO: ${WHATSAPP_DESTINO}
      TZ: America/Sao_Paulo
    networks:
      - advice_internal
      - Monadanet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Monadanet"
        - "traefik.http.routers.advice.rule=Host(`advice.autozapx.com`)"
        - "traefik.http.routers.advice.entrypoints=web"
        - "traefik.http.routers.advice-secure.rule=Host(`advice.autozapx.com`)"
        - "traefik.http.routers.advice-secure.entrypoints=websecure"
        - "traefik.http.routers.advice-secure.tls=true"
        - "traefik.http.routers.advice-secure.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.advice.loadbalancer.server.port=3000"

networks:
  advice_internal:
    driver: overlay
  Monadanet:
    external: true
